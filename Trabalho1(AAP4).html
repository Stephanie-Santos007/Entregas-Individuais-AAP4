<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
    /* Muda a fonte e a cor de fundo da página toda */
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
    }

    /* Estilo do Cabeçalho escuro e texto centralizado */
    header {
        background-color: #82409e;
        color: white;
        text-align: center;
        padding: 20px;
    }

    /* Caixa central (Isso aqui garante a Responsividade!) */
    main {
        max-width: 600px;
        margin: 30px auto;
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    /* Deixa os campos de digitar mais largos e arredondados */
    input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }

    /* Estilo do Botão azul */
    button {
        width: 100%;
        background-color: #d265d0;
        color: white;
        padding: 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
    }

    /* Muda a cor do botão quando passa o mouse por cima */
    button:hover {
        background-color: #9329b9;
    }

     /* Estilo da Tabela */
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }

    th, td {
        border-bottom: 1px solid #ddd;
        padding: 12px;
        text-align: left;
    }

    /* Cabeçalho da tabela escuro para combinar com o topo */
    th {
        background-color: #714198;
        color: white;
    }

    /* Efeito "Zebrado" nas linhas para facilitar a leitura */
    tr:nth-child(even) {
        background-color: #f9f9f9;
    }


</style> 


</head>
<body>
    
<!-- O cabeçalho da página -->
    <header>
        <h1>Sistema de Gestão</h1>
    </header>

    <!-- O conteúdo principal -->
    <main>
        
        <!-- Seção 1: Formulário de Cadastro -->
        <section id="cadastro">
            <h2>Cadastrar Novo Item</h2>

            <form>
    <label for="nome">Nome do Item:</label>
    <input type="text" id="nome" name="nome" placeholder="Ex: Cadeira" required>
    <br><br>
    
    <label for="quantidade">Quantidade:</label>
    <input type="number" id="quantidade" name="quantidade" placeholder="Ex: 10" required>
    <br><br>
    
    <button type="submit">Salvar Cadastro</button>
</form>

        </section>

        <!-- Seção 2: Visualização dos Dados -->
        <section id="visualizacao">

            <h2>Itens Cadastrados</h2>
            <table>
    <thead>
        <tr>
            <th>Nome do Item</th>
            <th>Quantidade</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Cadeira</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Mesa Branca</td>
            <td>2</td>
        </tr>
    </tbody>
</table>

        </section>

    </main>

    <!-- O rodapé da página -->
    <footer>
        <p>Desenvolvido para o Trabalho 1</p>
    </footer>

</body>
</html>
